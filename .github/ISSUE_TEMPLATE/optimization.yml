name: Optimization / 优化建议
description: 用基线、目标收益与回归风险描述优化机会。
title: '[Optimization] '
body:
- type: markdown
  attributes:
    value: 请先搜索已有 Issue。只提交可公开的信息；日志请脱敏。区分已验证事实、疑似问题与推测；没有证据或未执行测试时直接说明，不要编造。
- type: dropdown
  id: evidence_status
  attributes:
    label: Evidence Status / 证据状态
    description: 选择当前已知状态；具体证据与推测分别写入下方。
    options:
    - VERIFIED / 已验证
    - SUSPECTED / 疑似，尚未验证
    - UNKNOWN / 信息不足
  validations:
    required: true
- type: textarea
  id: objective
  attributes:
    label: Objective / 优化目标
    description: 当前瓶颈、影响对象以及为什么值得优化。
  validations:
    required: true
- type: textarea
  id: baseline
  attributes:
    label: Baseline / 基线数据
    description: 指标、测试命令、环境、样本与数据来源；尚未测量请写 NOT_RUN，并说明测量方法。
  validations:
    required: true
- type: textarea
  id: target
  attributes:
    label: Target Benefit / 目标收益
    description: 可衡量的目标及其依据；预测收益必须标注为估计。
  validations:
    required: true
- type: textarea
  id: regression_risk
  attributes:
    label: Regression Risk / 回归风险
    description: 可能退化的行为、资源、兼容性，以及必要的回归验证。
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Evidence / 证据与推测
    description: 给出日志、截图、数据或代码链接，并注明版本。分别标注 FACT、SUSPECTED、HYPOTHESIS；没有证据请写“暂无 / NOT_RUN”。
  validations:
    required: false
- type: textarea
  id: acceptance_criteria
  attributes:
    label: Acceptance Criteria / 验收标准
    description: 描述可观察、可测试的完成条件；不要求现在已有测试结果。
  validations:
    required: true
- type: textarea
  id: constraints
  attributes:
    label: Constraints / 约束
    description: 兼容性、性能、安全、时限及不可修改的范围；无已知约束可留空。
  validations:
    required: false
